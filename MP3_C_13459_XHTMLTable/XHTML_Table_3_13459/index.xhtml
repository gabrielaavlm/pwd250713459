<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN"

<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <title>Menggabungkan Baris dan Kolom XHTML Table</title>
</head>

<body>
    <h2>Jadwal Mata Pelajaran</h2>

    <table border="1" cellpadding="5">
        <tr>
            <th colspan="2">Jadwal Mata Pelajaran</th>
        </tr>
        <tr>
            <th>Waktu</th>
            <th>Mapel</th>
        </tr>
        <tr>
            <td rowspan="2">07.00-08.00</td>
            <td>Matematika</td>
        </tr>
        <tr>
            <td>09.00-10.00</td>
        </tr>
        <tr>
            <td>10.00-11.00</td>
            <td>Fisika</td>
        </tr>
        <tr>
            <td>11.00-12.00</td>
            <td>Bahasa Indonesia</td>
        </tr>
    </table>
</body>
</html>
