<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN"
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en" lang="en">
<!-- Deklarasi XHTML, dengan dasar aturannyaa adalah HTML yang mengikuti aturan XML -->
 <head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title>My Page</title>
</head>
<!-- Bagian kepala halaman. Informasi dapat dilihat pada jendela halaman website, dimana judul halaman akan ditmampilkan -->
<body>
    <h1>HTML</h1>
    <h4>Pengertian</h4>
    <p>HTML atau <em>HyperText Markup Language</em> adalah <strong>bahasa markup</strong> yang digunakan untuk membuat halaman web.</p>
</body>
 <!-- Bagian tubuh halaman, dimana berisi informasi yang ditampilkan ke pengguna.
  Tag h1 adalah heading, tag h4 adalah sub heading 4, dan tag p digunakan untuk membuat paragraf -->
</html>
